name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0
          use-cache: false
      - name: Verify signed annotated tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          object_type=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${GITHUB_REF_NAME}" --jq .object.type)
          test "$object_type" = tag
          tag_sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${GITHUB_REF_NAME}" --jq .object.sha)
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_sha}" --jq .verification.verified)" = true
      - name: Verify source
        run: |
          zig fmt --check build.zig src test examples spikes bench
          zig build test
          python3 test/validate_fixtures.py
          python3 test/test_cli.py
          python3 test/verify_authorship.py
      - name: Build reproducible launchers
        run: |
          set -eu
          mkdir -p dist first second
          for target in x86_64-linux-gnu x86_64-macos-none x86_64-windows-gnu; do
            rm -rf first/* second/*
            zig build -Dtarget="$target" -Doptimize=ReleaseSafe --prefix "$PWD/first"
            zig build -Dtarget="$target" -Doptimize=ReleaseSafe --prefix "$PWD/second"
            suffix=
            if [ "$target" = x86_64-windows-gnu ]; then suffix=.exe; fi
            cmp "first/bin/zig-tool${suffix}" "second/bin/zig-tool${suffix}"
            mkdir "zig-blacksmith-${GITHUB_REF_NAME}-${target}"
            cp "first/bin/zig-tool${suffix}" "zig-blacksmith-${GITHUB_REF_NAME}-${target}/"
            tar -czf "dist/zig-blacksmith-${GITHUB_REF_NAME}-${target}.tar.gz" \
              "zig-blacksmith-${GITHUB_REF_NAME}-${target}"
            rm -rf "zig-blacksmith-${GITHUB_REF_NAME}-${target}"
          done
          (cd dist && sha256sum -- *.tar.gz > SHA256SUMS)
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes
