name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0
      - run: zig fmt --check build.zig src test examples spikes bench
      - run: zig build test
      - run: zig build docs
      - run: zig build -Doptimize=ReleaseSafe

  compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0
      - run: zig build blacksmith -- check ping
      - run: zig build blacksmith -- fixtures generate all --ack-version 2026-07-28
      - run: git diff --exit-code -- test/fixtures
      - run: python3 test/validate_fixtures.py
      - run: python3 test/test_cli.py
      - run: python3 test/verify_authorship.py
      - run: zig build fuzz-smoke
      - run: zig build bench
